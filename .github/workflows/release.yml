# Release: `gh release create vX.Y.Z --target main` creates the tag on GitHub and starts this
# workflow; the tag must match `__version__`. The workflow runs CI, checks the tag against the
# package version, builds once, publishes to TestPyPI, installs that release from TestPyPI and
# recalculates a small workbook with it, then publishes the same files to PyPI.
#
# Publishing uses trusted publishing (OpenID Connect), so no token is stored. Configure on
# test.pypi.org and pypi.org a trusted publisher for owner `sheetmill`, repository
# `xlrecalc`, workflow `release.yml`, environments `testpypi` and `pypi`. Give the GitHub
# environment `pypi` a required reviewer, so the PyPI step waits for a person to approve it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: The tag matches the package version
        run: |
          version=$(uv run --no-project python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('src/xlrecalc/__init__.py').read())[1])")
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - run: uv build
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/xlrecalc/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    needs: testpypi
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@v5
      - name: Install the release from TestPyPI and recalculate a workbook
        run: |
          version="${GITHUB_REF_NAME#v}"
          uv venv /tmp/env
          # Only xlrecalc itself is taken from TestPyPI; its dependencies, as its own metadata
          # declares them, come from PyPI.
          # TestPyPI's index can lag the upload by a minute.
          for attempt in 1 2 3 4 5 6; do
            uv pip install -p /tmp/env --no-cache --no-deps --index-url https://test.pypi.org/simple/ "xlrecalc==${version}" && break
            sleep 20
          done
          /tmp/env/bin/python -I -c "from importlib.metadata import requires; print('\n'.join(r for r in (requires('xlrecalc') or []) if 'extra ==' not in r))" > /tmp/requirements.txt
          cat /tmp/requirements.txt
          uv pip install -p /tmp/env -r /tmp/requirements.txt
          # openpyxl (not a dependency) writes the workbook and reads the values back.
          uv pip install -p /tmp/env openpyxl
          XLRECALC_VERSION="${version}" /tmp/env/bin/python -I - <<'PY'
          import os, pathlib, tempfile
          import openpyxl, xlrecalc
          assert xlrecalc.__version__ == os.environ["XLRECALC_VERSION"]
          path = pathlib.Path(tempfile.mkdtemp()) / "check.xlsx"
          wb = openpyxl.Workbook()
          wb.active["A1"] = 2
          wb.active["A2"] = "=A1*21"
          wb.active["A3"] = '=TEXT(A2,"0.00")'
          wb.save(path)
          report = xlrecalc.recalculate(path)
          assert not report.uncomputed, report
          ws = openpyxl.load_workbook(path, data_only=True).active
          assert (ws["A2"].value, ws["A3"].value) == (42, "42.00"), (ws["A2"].value, ws["A3"].value)
          print(xlrecalc.__version__, ws["A2"].value, ws["A3"].value)
          PY

  pypi:
    needs: verify-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/xlrecalc/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
